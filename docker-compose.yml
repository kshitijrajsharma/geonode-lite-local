name: geonode

x-common-django-env: &common-django-env
  DJANGO_SETTINGS_MODULE: geonode.settings
  GEONODE_INSTANCE_NAME: geonode
  DEBUG: "False"
  DOCKER_ENV: production
  C_FORCE_ROOT: "1"
  FORCE_REINIT: "false"
  INVOKE_LOG_STDOUT: "true"
  SECRET_KEY: "geonode-lite-local-not-a-secret-change-if-public"
  SITEURL: http://localhost:8000/
  ALLOWED_HOSTS: "['localhost', '127.0.0.1', 'django', 'geoserver']"
  CSRF_TRUSTED_ORIGINS: "http://localhost:8000,http://localhost:8888,http://127.0.0.1:8000,http://127.0.0.1:8888"

  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  GEONODE_DATABASE: geonode
  GEONODE_DATABASE_USER: geonode
  GEONODE_DATABASE_PASSWORD: geonode
  GEONODE_GEODATABASE: geonode_data
  GEONODE_GEODATABASE_USER: geonode_data
  GEONODE_GEODATABASE_PASSWORD: geonode_data
  GEONODE_DATABASE_SCHEMA: public
  GEONODE_GEODATABASE_SCHEMA: public
  DATABASE_HOST: db
  DATABASE_PORT: "5432"
  DATABASE_URL: postgis://geonode:geonode@db:5432/geonode
  GEODATABASE_URL: postgis://geonode_data:geonode_data@db:5432/geonode_data
  GEONODE_DB_CONN_MAX_AGE: "0"
  GEONODE_DB_CONN_TOUT: "5"
  DEFAULT_BACKEND_DATASTORE: datastore
  POSTGRESQL_MAX_CONNECTIONS: "50"

  BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CELERY_BEAT_SCHEDULER: celery.beat:PersistentScheduler
  ASYNC_SIGNALS: "True"
  CELERY__WORKER_CONCURRENCY: "2"
  CELERY__AUTOSCALE_VALUES: "4,2"
  CELERY__MAX_MEMORY_PER_CHILD: "150000"
  CELERY__HARVESTER_CONCURRENCY: "2"
  CELERY__HARVESTER_AUTOSCALE_VALUES: "3,2"
  CELERY__HARVESTER_MAX_MEMORY_PER_CHILD: "200000"

  # Hardcoded to skip GeoNode's Docker-socket introspection fallback.
  GEONODE_LB_HOST_IP: django
  GEONODE_LB_PORT: "8000"

  GEOSERVER_LB_HOST_IP: geoserver
  GEOSERVER_LB_PORT: "8080"
  GEOSERVER_LOCATION: http://geoserver:8080/geoserver/
  GEOSERVER_PUBLIC_LOCATION: http://localhost:8888/geoserver/
  GEOSERVER_WEB_UI_LOCATION: http://localhost:8888/geoserver/
  # Read by the GeoServer entrypoint to rewrite proxyBaseUrl in global.xml.
  NGINX_BASE_URL: http://localhost:8888
  GEOSERVER_ADMIN_USER: admin
  GEOSERVER_ADMIN_PASSWORD: admin
  OGC_REQUEST_TIMEOUT: "30"
  OGC_REQUEST_MAX_RETRIES: "1"
  OGC_REQUEST_BACKOFF_FACTOR: "0.3"
  OGC_REQUEST_POOL_MAXSIZE: "10"
  OGC_REQUEST_POOL_CONNECTIONS: "10"

  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: admin
  ADMIN_EMAIL: admin@localhost

  EMAIL_ENABLE: "False"
  DJANGO_EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
  DEFAULT_FROM_EMAIL: admin@localhost

  LOCKDOWN_GEONODE: "False"
  X_FRAME_OPTIONS: SAMEORIGIN
  SESSION_ENGINE: django.contrib.sessions.backends.db
  SESSION_EXPIRED_CONTROL_ENABLED: "True"
  DEFAULT_ANONYMOUS_PERMISSIONS: download
  DEFAULT_REGISTERED_MEMBERS_PERMISSIONS: download
  CORS_ALLOW_ALL_ORIGINS: "True"
  GEOSERVER_CORS_ENABLED: "True"
  GEOSERVER_CORS_ALLOWED_ORIGINS: "*"
  GEOSERVER_CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,HEAD,OPTIONS"
  GEOSERVER_CORS_ALLOWED_HEADERS: "*"

  ACCOUNT_OPEN_SIGNUP: "True"
  ACCOUNT_SIGNUP_FIELDS: "['email*', 'username*', 'password1*', 'password2*']"
  ACCOUNT_APPROVAL_REQUIRED: "False"
  ACCOUNT_CONFIRM_EMAIL_ON_GET: "False"
  ACCOUNT_EMAIL_VERIFICATION: none
  ACCOUNT_LOGIN_METHODS: "{'email', 'username'}"
  AUTO_ASSIGN_REGISTERED_MEMBERS_TO_REGISTERED_MEMBERS_GROUP_NAME: "True"
  AUTO_ASSIGN_REGISTERED_MEMBERS_TO_CONTRIBUTORS: "True"

  OAUTH2_API_KEY: ""
  OAUTH2_CLIENT_ID: "Jrchz2oPY3akmzndmgUTYrs9gczlgoV20YPSvqaV"
  OAUTH2_CLIENT_SECRET: "rCnp5txobUo83EpQEblM8fVj3QT5zb5qRfxNsuPzCqZaiRyIoxM4jdgMiZKFfePBHYXCLd7B8NlkfDBY9HKeIQPcy5Cp08KQNpRHQbjpLItDHv12GvkSeXp6OxaUETv3"

  API_LOCKDOWN: "False"

  STATIC_ROOT: /mnt/volumes/statics/static/
  MEDIA_ROOT: /mnt/volumes/statics/uploaded/
  ASSETS_ROOT: /mnt/volumes/statics/assets/
  CACHE_BUSTING_STATIC_ENABLED: "False"
  MEMCACHED_ENABLED: "False"

  TIME_ENABLED: "True"
  MOSAIC_ENABLED: "False"
  MAX_DOCUMENT_SIZE: "200"
  CLIENT_RESULTS_LIMIT: "5"
  API_LIMIT_PER_PAGE: "1000"
  GEONODE_CLIENT_LAYER_PREVIEW_LIBRARY: mapstore
  MODIFY_TOPICCATEGORY: "True"
  AVATAR_GRAVATAR_SSL: "True"
  EXIF_ENABLED: "True"
  CREATE_LAYER: "True"
  FAVORITE_ENABLED: "True"
  RESOURCE_PUBLISHING: "False"
  ADMIN_MODERATE_UPLOADS: "False"
  HARVESTING_MONITOR_ENABLED: "True"
  HARVESTING_MONITOR_DELAY: "60"
  DEFAULT_MAX_PARALLEL_UPLOADS_PER_USER: "5"
  XLSX_UPLOAD_ENABLED: "False"

  HTTP_HOST: localhost
  HTTPS_HOST: ""
  HTTP_PORT: "8000"
  HTTPS_PORT: "443"
  LETSENCRYPT_MODE: disabled

x-common-django: &common-django
  image: geonode/geonode:5.0.2
  restart: unless-stopped
  environment: *common-django-env
  volumes:
    - statics:/mnt/volumes/statics
    - geoserver-data-dir:/geoserver_data/data
    - data:/data
    - tmp:/tmp
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:

  db:
    image: geonode/postgis:15-3.5-latest
    restart: unless-stopped
    command: postgres -c max_connections=50
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      GEONODE_DATABASE: geonode
      GEONODE_DATABASE_USER: geonode
      GEONODE_DATABASE_PASSWORD: geonode
      GEONODE_GEODATABASE: geonode_data
      GEONODE_GEODATABASE_USER: geonode_data
      GEONODE_GEODATABASE_PASSWORD: geonode_data
      GEONODE_DATABASE_SCHEMA: public
      GEONODE_GEODATABASE_SCHEMA: public
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  data-dir-conf:
    image: geonode/geoserver_data:2.28.x-latest
    restart: unless-stopped
    entrypoint: ["sleep", "infinity"]
    volumes:
      - geoserver-data-dir:/geoserver_data/data
    healthcheck:
      test: ["CMD-SHELL", "test \"$(ls -A /geoserver_data/data | wc -l)\" -gt 0"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 64M

  geoserver:
    image: geonode/geoserver:2.28.x-latest
    restart: unless-stopped
    environment:
      <<: *common-django-env
      GEOSERVER_JAVA_OPTS: >-
        -Djava.awt.headless=true
        -Xms256m -Xmx1g
        -Dgwc.context.suffix=gwc
        -XX:SoftRefLRUPolicyMSPerMB=36000
        -XX:-UseGCOverheadLimit
        -XX:ParallelGCThreads=2
        -Dfile.encoding=UTF8
        -Duser.timezone=GMT
        -DGEOSERVER_CSRF_DISABLED=true
        -DPRINT_BASE_URL=http://localhost:8888/geoserver/pdf
        -DALLOW_ENV_PARAMETRIZATION=true
    ports:
      - "8888:8080"
    volumes:
      - statics:/mnt/volumes/statics
      - geoserver-data-dir:/geoserver_data/data
      - data:/data
      - tmp:/tmp
    healthcheck:
      test: ["CMD-SHELL", "curl -m 10 --fail --silent --output /dev/null http://localhost:8080/geoserver/ows || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s
    depends_on:
      data-dir-conf:
        condition: service_healthy
      django:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1536M

  django:
    <<: *common-django
    environment:
      <<: *common-django-env
      IS_CELERY: "False"
    ports:
      - "8000:8000"
    entrypoint: ["/usr/src/geonode/entrypoint.sh"]
    command: >-
      uwsgi --ini /usr/src/geonode/uwsgi.ini
      --static-map /static=/mnt/volumes/statics/static
      --static-map /uploaded=/mnt/volumes/statics/uploaded
      --static-map /assets=/mnt/volumes/statics/assets
    healthcheck:
      test: ["CMD-SHELL", "curl -m 10 --fail --silent --output /dev/null http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 1536M

  celery:
    <<: *common-django
    environment:
      <<: *common-django-env
      IS_CELERY: "True"
    depends_on:
      django:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    entrypoint: ["/usr/src/geonode/entrypoint.sh"]
    command: "celery-cmd"
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  statics:
  geoserver-data-dir:
  dbdata:
  data:
  tmp:
  redisdata:
